<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fênix | Sistema de Infraestrutura V.1.7</title>
    <style>
        :root { --primary-color: #041273; --bg-color: #f1f5f9; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: #1e293b; padding: 10px; }
        .container { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; border-top: 6px solid var(--primary-color); margin: auto; position: relative; }
        .version-tag { position: absolute; top: 10px; right: 15px; font-size: 0.6rem; color: #94a3b8; font-weight: bold; }
        h2 { text-align: center; color: var(--primary-color); font-size: 1.2rem; text-transform: uppercase; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: #64748b; margin-bottom: 2px; }
        input, select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.85rem; box-sizing: border-box; }
        .results { background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        .res-line { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 5px; }
        .res-val { font-weight: bold; color: var(--primary-color); }
        .total-highlight { color: #b91c1c; font-weight: bold; border-top: 1px solid #e2e8f0; padding-top: 5px; margin-top: 5px; }
        .btn { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; width: 100%; transition: 0.3s; margin-bottom: 8px; }
        .btn-save { background: var(--primary-color); color: white; }
        .btn-copy { background: #e2e8f0; color: #475569; }
        .search-section { margin-top: 20px; border-top: 2px solid #e2e8f0; padding-top: 15px; }
        .history-item { background: white; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; font-size: 0.75rem; cursor: pointer; }
        .history-item:hover { border-color: var(--primary-color); }
        footer { text-align: center; font-size: 7pt; color: gray; margin-top: 20px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="container">
    <div class="version-tag">V.1.7</div>
    <h2>Fênix | Infraestrutura & Projetos</h2>
    
    <div class="grid" style="grid-template-columns: 1fr;">
        <div class="input-group"><label>Técnico Responsável</label><input type="text" id="tecnico" value="Cristiano Fênix"></div>
        <div class="input-group"><label>Nome do Cliente (Opcional)</label><input type="text" id="cliente" placeholder="Ex: Marco Aurelio"></div>
    </div>

    <div class="grid">
        <div class="input-group"><label>Nº Câmeras</label><input type="number" id="cameras" oninput="calcular()"></div>
        <div class="input-group"><label>FPS</label><input type="number" id="fps" oninput="calcular()"></div>
        <div class="input-group">
            <label>Resolução</label>
            <select id="resolucao" onchange="calcular()">
                <option value="2" selected>1080p</option>
                <option value="4">4MP</option>
                <option value="8">4K</option>
            </select>
        </div>
        <div class="input-group"><label>Dias Retenção</label><input type="number" id="dias" oninput="calcular()"></div>
        <div class="input-group">
            <label>Reserva Técnica</label>
            <select id="reserva" onchange="calcular()">
                <option value="1.1">10%</option>
                <option value="1.2">20%</option>
                <option value="1.3" selected>30%</option>
            </select>
        </div>
        <div class="input-group"><label>Código Gerado</label><input type="text" id="codigo" readonly style="background: #f1f5f9;"></div>
    </div>

    <div class="results">
        <div class="res-line"><span>Banda Real (Upload):</span> <span class="res-val" id="bandaReal">0.00 Mbps</span></div>
        <div class="res-line"><span>Consumo Diário:</span> <span class="res-val" id="storageDia">0.00 GB</span></div>
        <div class="res-line total-highlight">
            <span>CONSUMO TOTAL DO PERÍODO:</span> <span id="storageTotal">0.00 TB</span>
        </div>
        <div class="res-line" style="margin-top:10px; border-top: 1px solid var(--primary-color); padding-top:8px;">
            <strong>HD SUGERIDO (COMPRA):</strong> <span class="res-val" id="hdSugerido" style="font-size: 1rem;">---</span>
        </div>
    </div>

    <button class="btn btn-save" onclick="salvarOrcamento()">Salvar no Sistema (LocalHost)</button>
    <button class="btn btn-copy" onclick="copiarResumo()">Copiar para WhatsApp</button>

    <div class="search-section">
        <label>Buscar nos Registros (Nome ou Código)</label>
        <input type="text" id="busca" placeholder="Digite para buscar..." oninput="listarHistorico()">
        <div id="historico" style="margin-top: 10px;"></div>
    </div>

    <footer>
        Desenvolvido por ©Fênix Soluções Tecnológicas 2026 | Aracaju - SE<br>
        Zap: (79) 9 9968-0880 | Instagram: @fenixsolucoestecnologicas
    </footer>
</div>

<script>
    function gerarCodigo() {
        return Math.floor(Math.random() * 900000 + 100000).toString();
    }

    function calcular() {
        const qtd = parseFloat(document.getElementById('cameras').value) || 0;
        const res = parseFloat(document.getElementById('resolucao').value);
        const fps = parseFloat(document.getElementById('fps').value) || 0;
        const dias = parseFloat(document.getElementById('dias').value) || 0;
        const reserva = parseFloat(document.getElementById('reserva').value);

        // Cálculo ajustado para H.265+ (Eficiência média de 1.8 Mbps para 1080p/20fps)
        let bitrateBase = (res * (fps / 30) * 2.5) * 0.5; 
        let banda = (qtd * bitrateBase) * reserva;
        let storageGBDia = (qtd * bitrateBase * 86400) / 8 / 1024;
        let storageTotalTB = (storageGBDia * dias) / 1024;
        let storageComReserva = storageTotalTB * reserva;

        document.getElementById('bandaReal').innerText = banda.toFixed(2) + " Mbps";
        document.getElementById('storageDia').innerText = storageGBDia.toFixed(2) + " GB";
        document.getElementById('storageTotal').innerText = storageTotalTB.toFixed(2) + " TB";

        const hds = [1, 2, 4, 6, 8, 10, 12, 16];
        let sugestao = hds.find(h => h >= storageComReserva);
        document.getElementById('hdSugerido').innerText = (sugestao ? sugestao + " TB" : storageComReserva.toFixed(2) + " TB") + " (Surveillance)";
        
        if(!document.getElementById('codigo').value) document.getElementById('codigo').value = gerarCodigo();
    }

    function salvarOrcamento() {
        const dados = {
            id: document.getElementById('codigo').value,
            tecnico: document.getElementById('tecnico').value,
            cliente: document.getElementById('cliente').value || "Não informado",
            cameras: document.getElementById('cameras').value,
            dias: document.getElementById('dias').value,
            consumo: document.getElementById('storageTotal').innerText,
            hd: document.getElementById('hdSugerido').innerText,
            data: new Date().toLocaleDateString()
        };

        let db = JSON.parse(localStorage.getItem('fenix_db_v17') || "[]");
        db.push(dados);
        localStorage.setItem('fenix_db_v17', JSON.stringify(db));
        alert("Orçamento #" + dados.id + " salvo!");
        document.getElementById('codigo').value = gerarCodigo();
        listarHistorico();
    }

    function listarHistorico() {
        const busca = document.getElementById('busca').value.toLowerCase();
        const db = JSON.parse(localStorage.getItem('fenix_db_v17') || "[]");
        const lista = document.getElementById('historico');
        lista.innerHTML = "";

        db.reverse().filter(i => i.cliente.toLowerCase().includes(busca) || i.id.includes(busca))
          .forEach(item => {
            lista.innerHTML += `
                <div class="history-item">
                    <strong>#${item.id} - ${item.cliente}</strong><br>
                    Câmeras: ${item.cameras} | Retenção: ${item.dias} dias<br>
                    Consumo: ${item.consumo} | HD Sugerido: ${item.hd} | Data: ${item.data}
                </div>`;
        });
    }

    function copiarResumo() {
        const t = document.getElementById('tecnico').value;
        const cl = document.getElementById('cliente').value;
        const id = document.getElementById('codigo').value;
        const b = document.getElementById('bandaReal').innerText;
        const st = document.getElementById('storageTotal').innerText;
        const hd = document.getElementById('hdSugerido').innerText;

        const texto = `*Fênix Soluções - Relatório Técnico #${id}*\n` +
                      `Cliente: ${cl}\n` +
                      `Técnico: ${t}\n\n` +
                      `• Upload Mínimo: ${b}\n` +
                      `• Consumo do Período: ${st}\n` +
                      `• HD Recomendado para Compra: ${hd}\n\n` +
                      `© Fênix Soluções Tecnológicas`;
        
        navigator.clipboard.writeText(texto);
        alert("Resumo copiado!");
    }

    window.onload = () => { listarHistorico(); document.getElementById('codigo').value = gerarCodigo(); };
</script>

</body>
</html>
